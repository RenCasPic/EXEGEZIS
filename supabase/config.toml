# Local Supabase for the EXEGEZIS web app (`npx supabase start`, docs/13-accounts.md).
# The hosted project needs the same Auth settings, set in the Dashboard.

project_id = "exegezis"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

# Every email Auth sends (verification, recovery) lands here instead of a real
# inbox: http://127.0.0.1:54324. The tests read it.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
# The app (apps/web): email links and OAuth come back to /auth/callback.
site_url = "http://127.0.0.1:4100"
# Email links and OAuth come back to /auth/callback?next=…: allow the app's paths (with their query).
additional_redirect_urls = ["http://127.0.0.1:4100/**", "http://localhost:4100/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
# Settings → Account links Google or GitHub to an existing account.
enable_manual_linking = true
minimum_password_length = 10

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = true
# Verification by email is required before the first sign-in.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

# OAuth (optional): create the apps at GitHub and Google with the callback
# http://127.0.0.1:54321/auth/v1/callback, put their keys in the environment
# and set enabled = true; then EXEGEZIS_OAUTH_PROVIDERS=github,google.
[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
redirect_uri = ""

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = true
