<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXEGEZIS · Inicio · referencia de diseño</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Geist',ui-sans-serif,system-ui,sans-serif}
a{color:var(--accent-text);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,header{color:var(--heading,inherit)}
</style>

</head>
<body>
<div id="root"></div>
<template id="tpl">

<div style="{{ rootStyle }}">

  <header style="height: 64px; box-sizing: border-box; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: var(--bg)">
    <div style="display: flex; align-items: center; gap: 40px">
      <a href="#" style="display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><path d="M8 8h8"></path><path d="M8 12h5"></path><path d="M8 16h8"></path></svg>
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-weight: 600; font-size: 15px; letter-spacing: 0.14em">EXEGEZIS</span>
      </a>
      <nav aria-label="Principal" style="display: flex; gap: 4px; font-size: 14px">
        <a href="#" aria-current="page" style="padding: 8px 12px; border-radius: 8px; background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); color: var(--fg); font-weight: 500">Inicio</a>
        <a href="#" style="padding: 8px 12px; border-radius: 8px; color: var(--muted)">Inspecciones</a>
        <a href="#" style="padding: 8px 12px; border-radius: 8px; color: var(--muted)">Investigaciones</a>
        <a href="#" style="padding: 8px 12px; border-radius: 8px; color: var(--muted)">Causas raíz</a>
        <a href="#" style="padding: 8px 12px; border-radius: 8px; color: var(--muted)">Benchmarks</a>
        <a href="#" style="padding: 8px 12px; border-radius: 8px; color: var(--muted)">Ajustes</a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div role="group" aria-label="Tema de color" style="display: flex; padding: 3px; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px">
        <sc-for list="{{ themeOptions }}" as="o" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{ o.pressed }}" aria-label="{{ o.aria }}" onClick="{{ o.pick }}" style="{{ o.style }}">
            <sc-if value="{{ o.isLight }}" hint-placeholder-val="{{ true }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></sc-if>
            <sc-if value="{{ o.isDark }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg></sc-if>
            <sc-if value="{{ o.isSystem }}" hint-placeholder-val="{{ false }}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"></rect><path d="M8 21h8"></path><path d="M12 17v4"></path></svg></sc-if>
            {{ o.label }}
          </button>
        </sc-for>
      </div>
      <button type="button" style="height: 36px; padding: 0 12px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: inherit; font-size: 13px; color: var(--fg); cursor: pointer">
        <span style="color: var(--muted)">Proyecto</span>
        <span style="font-weight: 500">Todos</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
    </div>
  </header>

  <main style="flex-grow: 1; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 56px">

    <section aria-labelledby="hero-title" style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 16px; padding: 44px 48px 36px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; color: var(--accent-text)">INSPECCIÓN WEB</span>
        <h1 id="hero-title" style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em">Revisa cualquier página web.</h1>
        <p style="margin: 0; font-size: 17px; line-height: 1.5; color: var(--muted); max-width: 720px">EXEGEZIS la recorre en modo solo lectura, repite cada comprobación y solo reporta lo que se reproduce siempre, con la evidencia y un test para volver a ejecutarlo.</p>
      </div>
      <form style="display: flex; gap: 12px; align-items: flex-end">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px">
          <label for="url" style="font-size: 13px; font-weight: 500">URL del sitio</label>
          <div style="height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--field)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <input id="url" type="url" placeholder="https://tu-sitio.com" style="flex-grow: 1; border: 0; outline: none; font: inherit; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 16px; color: var(--fg); background: transparent">
          </div>
        </div>
        <button type="submit" style="height: 56px; padding: 0 28px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; cursor: pointer">
          Inspeccionar
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </button>
      </form>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px">
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted)">
          <span style="padding: 5px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line)">Hasta 20 páginas</span>
          <span style="padding: 5px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line)">Profundidad 2</span>
          <span style="padding: 5px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line)">3 repeticiones</span>
          <span style="padding: 5px 10px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); display: flex; align-items: center; gap: 6px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Solo lectura</span>
          <button type="button" style="border: 0; background: transparent; font: inherit; font-size: 13px; font-weight: 500; color: var(--accent-text); padding: 5px 6px; cursor: pointer">Opciones avanzadas</button>
        </div>
        <span style="font-size: 13px; color: var(--muted)">Inspecciona solo sitios que sean tuyos o para los que tengas permiso.</span>
      </div>
      <div style="border-top: 1px solid var(--line); padding-top: 18px; font-size: 14px; color: var(--muted); display: flex; gap: 6px">
        ¿Tienes un síntoma concreto?
        <a href="#" style="font-weight: 500">Abrir una investigación →</a>
      </div>
    </section>

    <section aria-labelledby="proof-title" style="display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 id="proof-title" style="margin: 0; font-size: 20px; font-weight: 600">Lo demostrado</h2>
        <span style="font-size: 13px; color: var(--muted)">Valores únicos por caso · el último resultado de cada uno · sin datos de demo</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <div style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; color: var(--muted)">Bugs verificados</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 40px; font-weight: 500; line-height: 1">3</span>
          <span style="font-size: 13px; color: var(--muted); line-height: 1.45">3 de 3 bugs sembrados. 45 reproducciones en 20 ejecuciones.</span>
        </div>
        <div style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; color: var(--muted)">Causas raíz validadas</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 40px; font-weight: 500; line-height: 1">3<span style="font-size: 18px; color: var(--muted)"> / 6</span></span>
          <span style="font-size: 13px; color: var(--muted); line-height: 1.45">Frente a las alternativas probadas.</span>
          <span style="font-size: 13px; color: var(--bad); font-weight: 500; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg>1 falsa validación (ADV-002)</span>
        </div>
        <div style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; color: var(--muted)">Falsos VERIFIED</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 40px; font-weight: 500; line-height: 1; color: var(--ok)">0</span>
          <span style="font-size: 13px; color: var(--muted); line-height: 1.45">En 10 casos negativos: la app sana nunca sale como bug.</span>
        </div>
        <div style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 22px 24px; display: flex; flex-direction: column; gap: 8px">
          <span style="font-size: 14px; color: var(--muted)">Tiempo hasta verificar</span>
          <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 40px; font-weight: 500; line-height: 1">1:13</span>
          <span style="font-size: 13px; color: var(--muted); line-height: 1.45">Mediana en minutos, 39 reproducciones verificadas.</span>
        </div>
      </div>
    </section>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start">

      <section aria-labelledby="act-title" style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; display: flex; flex-direction: column">
        <div style="padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line)">
          <h2 id="act-title" style="margin: 0; font-size: 17px; font-weight: 600">Actividad por caso</h2>
          <div style="display: flex; align-items: center; gap: 16px">
            <div role="group" aria-label="Filtrar" style="display: flex; padding: 3px; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 8px; font-size: 13px">
              <button type="button" aria-pressed="true" style="border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; background: var(--panel); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.12)">Todos</button>
              <button type="button" aria-pressed="false" style="border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; background: transparent; color: var(--muted)">Demostrados</button>
              <button type="button" aria-pressed="false" style="border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; background: transparent; color: var(--muted)">Pendientes</button>
              <button type="button" aria-pressed="false" style="border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 13px; background: transparent; color: var(--muted)">Esperados</button>
            </div>
            <a href="#" style="font-size: 13px; font-weight: 500">Ver todo</a>
          </div>
        </div>
        <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 150px 170px 110px 120px 56px; gap: 16px; padding: 10px 24px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line)">
          <span>Caso</span><span>Veredicto</span><span>Evidencia de causa</span><span>Historial</span><span>Origen del plan</span><span style="text-align: right">Última</span>
        </div>
        <sc-for list="{{ rows }}" as="row" hint-placeholder-count="6">
          <div style="display: grid; grid-template-columns: minmax(0, 2.4fr) 150px 170px 110px 120px 56px; gap: 16px; align-items: center; padding: 14px 24px; border-bottom: 1px solid var(--line-soft)">
            <div style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-size: 14px; font-weight: 500">{{ row.title }}</span>
              <span style="font-size: 12px; color: var(--muted)"><span style="font-family: 'Geist Mono', ui-monospace, monospace">{{ row.id }}</span> · {{ row.note }}</span>
            </div>
            <div>
              <span style="{{ row.pillStyle }}">
                <sc-if value="{{ row.iOk }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
                <sc-if value="{{ row.iQ }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></sc-if>
                <sc-if value="{{ row.iOff }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path></svg></sc-if>
                <sc-if value="{{ row.iBad }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg></sc-if>
                {{ row.verdict }}
              </span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; gap: 3px" aria-hidden="true">
                <sc-for list="{{ row.meter }}" as="seg" hint-placeholder-count="5"><span style="{{ seg.style }}"></span></sc-for>
              </div>
              <span style="font-size: 12px; color: var(--muted)">{{ row.meterLabel }}</span>
            </div>
            <div style="display: flex; gap: 4px" aria-label="{{ row.historyLabel }}">
              <sc-for list="{{ row.dots }}" as="d" hint-placeholder-count="8"><span style="{{ d.style }}"></span></sc-for>
            </div>
            <div>
              <sc-if value="{{ row.mock }}" hint-placeholder-val="{{ false }}">
                <span style="font-size: 12px; font-weight: 500; color: var(--off); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--line-strong); background: repeating-linear-gradient(135deg, var(--sunken) 0 6px, var(--stripe) 6px 12px)">Replay</span>
              </sc-if>
              <sc-if value="{{ row.notMock }}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 12px; color: var(--muted)">{{ row.origin }}</span>
              </sc-if>
            </div>
            <span style="font-size: 12px; color: var(--muted); text-align: right">{{ row.when }}</span>
          </div>
        </sc-for>
        <div style="padding: 14px 24px; font-size: 12px; color: var(--muted); display: flex; gap: 20px; align-items: center">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 99px; background: var(--ok)"></span>Reproducido</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 99px; background: var(--q)"></span>Inconcluso</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 99px; border: 1.5px solid var(--off-dot); box-sizing: border-box"></span>No reproducido</span>
          <span>Replay = plan grabado, no una llamada nueva a la IA. No cuenta en las métricas de IA.</span>
        </div>
      </section>

      <div style="display: flex; flex-direction: column; gap: 24px">
        <section aria-labelledby="insp-title" style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 20px">
          <h2 id="insp-title" style="margin: 0; font-size: 17px; font-weight: 600">Inspecciones recientes</h2>
          <div style="border: 1.5px dashed var(--line-strong); border-radius: 12px; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--muted)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <span style="font-size: 15px; font-weight: 600">Aún no hay inspecciones</span>
            <span style="font-size: 13px; line-height: 1.5; color: var(--muted)">Pega una URL arriba para empezar. Aquí verás cada sitio con sus hallazgos verificados por gravedad.</span>
          </div>
        </section>

        <section aria-labelledby="cap-title" style="background: var(--panel); border: var(--panel-bw) solid var(--panel-border); box-shadow: var(--panel-shadow); border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
          <h2 id="cap-title" style="margin: 0; font-size: 17px; font-weight: 600">Qué puede demostrar hoy</h2>
          <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font-size: 14px">
            <sc-for list="{{ caps }}" as="c" hint-placeholder-count="8">
              <li style="display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line-soft)">
                <span style="display: flex; align-items: center; gap: 10px">
                  <span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 12px; color: var(--muted); width: 18px">{{ c.n }}</span>
                  {{ c.name }}
                </span>
                <span style="{{ c.style }}">{{ c.state }}</span>
              </li>
            </sc-for>
          </ol>
        </section>
      </div>
    </div>
  </main>
</div>
</template>
<script>window.__PROPS = {"theme": "light"};</script>

<script>
class DCLogic { constructor(props){ this.props = props || {}; this.state = {}; } setState(s){ this.state = Object.assign({}, this.state, s); render(); } }
function look(path, scope){
  path = path.trim();
  if (path === 'true') return true; if (path === 'false') return false;
  if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
  return path.split('.').reduce(function(o,k){ return o == null ? undefined : o[k]; }, scope);
}
function interp(str, scope){
  var whole = str.match(/^\s*\{\{([^}]+)\}\}\s*$/);
  if (whole) return look(whole[1], scope);
  return str.replace(/\{\{([^}]+)\}\}/g, function(_, p){ var v = look(p, scope); return v == null ? '' : String(v); });
}
function proc(node, scope, out){
  if (node.nodeType === 3) { out.appendChild(document.createTextNode(interp(node.nodeValue, scope))); return; }
  if (node.nodeType !== 1) return;
  var tag = node.tagName.toLowerCase();
  if (tag === 'sc-for') {
    var list = interp(node.getAttribute('list'), scope) || [];
    var as = node.getAttribute('as');
    list.forEach(function(item, i){ var s = Object.create(scope); s[as] = item; s.$index = i; node.childNodes.forEach(function(c){ proc(c, s, out); }); });
    return;
  }
  if (tag === 'sc-if') { if (interp(node.getAttribute('value'), scope)) node.childNodes.forEach(function(c){ proc(c, scope, out); }); return; }
  var el = document.createElementNS(node.namespaceURI, node.tagName);
  for (var i = 0; i < node.attributes.length; i++) {
    var a = node.attributes[i];
    if (/^on[A-Z]/.test(a.name) || /^on[a-z]+$/.test(a.name) && a.value.indexOf('{{') >= 0) {
      var fn = interp(a.value, scope); if (typeof fn === 'function') el.addEventListener(a.name.slice(2).toLowerCase(), fn); continue;
    }
    if (a.name.indexOf('hint-') === 0) continue;
    var v = interp(a.value, scope); if (v === false || v == null) continue;
    el.setAttribute(a.name, v === true ? '' : v);
  }
  var src = tag === 'template' ? node.content : node;
  src.childNodes.forEach(function(c){ proc(c, scope, el); });
  out.appendChild(el);
}
var comp, tpl;
function render(){
  var root = document.getElementById('root'); root.innerHTML = '';
  var vals = comp.renderVals();
  tpl.content.childNodes.forEach(function(c){ proc(c, vals, root); });
}
document.addEventListener('DOMContentLoaded', function(){
  tpl = document.getElementById('tpl');
  comp = new Component(window.__PROPS || {});
  render();
});
</script>

<script>
class Component extends DCLogic {
  renderVals() {
    var TOKENS = {
      light: {
        bg: '#F2F5F6', panel: '#FFFFFF', sunken: '#F2F5F6', field: '#FFFFFF', stripe: '#E3EAED',
        'panel-border': '#0066FF', 'panel-bw': '1.5px', 'panel-shadow': '0 1px 2px rgba(11,27,34,0.06)',
        line: '#E1E8EB', 'line-strong': '#B4C3C9', 'line-soft': '#E9EFF1',
        fg: '#0B1B22', muted: '#4D6069',
        accent: '#0066FF', 'accent-hover': '#0052CC', 'accent-text': '#0052CC', 'on-accent': '#FFFFFF',
        ok: '#15803D', 'ok-bg': '#E7F4EC', 'ok-bd': '#BFE0CB',
        warn: '#B45309', 'warn-bg': '#FCF1E3', 'warn-bd': '#F0D3AE',
        q: '#475569', 'q-bg': '#EEF1F4', 'q-bd': '#D5DBE3',
        off: '#5F6672', 'off-bg': '#EEF2F3', 'off-bd': '#D6DEE1', 'off-dot': '#8596A0',
        bad: '#B91C1C', 'bad-bg': '#FCEBEA', 'bad-bd': '#F2C6C3',
        empty: '#DCE4E7', wip: '#0E6682'
      },
      dark: {
        bg: '#011B34', panel: '#062443', sunken: '#01172C', field: '#01172C', stripe: '#0C2E52',
        'panel-border': '#D0DB4E', 'panel-bw': '1.5px', 'panel-shadow': 'none',
        line: '#0F3157', 'line-strong': '#2A5A8C', 'line-soft': '#0A2A4B',
        fg: '#D0DB4E', heading: '#FFFFFF', muted: '#93A7C1',
        accent: '#CDDC39', 'accent-hover': '#DCE775', 'accent-text': '#FFFFFF', 'on-accent': '#011B34',
        ok: '#3DDC97', 'ok-bg': 'rgba(61,220,151,0.12)', 'ok-bd': 'rgba(61,220,151,0.30)',
        warn: '#F5B544', 'warn-bg': 'rgba(245,181,68,0.12)', 'warn-bd': 'rgba(245,181,68,0.30)',
        q: '#AAB4C3', 'q-bg': 'rgba(170,180,195,0.12)', 'q-bd': 'rgba(170,180,195,0.28)',
        off: '#8A93A2', 'off-bg': 'rgba(138,147,162,0.10)', 'off-bd': 'rgba(138,147,162,0.26)', 'off-dot': '#6B7280',
        bad: '#F97366', 'bad-bg': 'rgba(249,115,102,0.12)', 'bad-bd': 'rgba(249,115,102,0.32)',
        empty: '#12365D', wip: '#FFFFFF'
      }
    };
    var choice = (this.state && this.state.theme) || this.props.theme || 'light';
    var mode = choice === 'dark' ? 'dark' : 'light';
    var t = TOKENS[mode];
    var vars = '';
    for (var k in t) vars += '--' + k + ': ' + t[k] + '; ';
    var rootStyle = vars + 'color-scheme: ' + mode + '; width: 1440px; height: 1480px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: \'Geist\', ui-sans-serif, system-ui, sans-serif; display: flex; flex-direction: column';

    var self = this;
    var themeOptions = [
      { id: 'light', label: 'Claro', aria: 'Tema claro' },
      { id: 'dark', label: 'Oscuro', aria: 'Tema oscuro' },
      { id: 'system', label: 'Sistema', aria: 'Usar el tema del sistema' }
    ].map(function (o) {
      var on = o.id === choice;
      return {
        label: o.label, aria: o.aria, pressed: on ? 'true' : 'false',
        isLight: o.id === 'light', isDark: o.id === 'dark', isSystem: o.id === 'system',
        pick: function () { self.setState({ theme: o.id }); },
        style: 'height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 7px; font: inherit; font-size: 13px; cursor: pointer; ' +
          (on ? 'background: var(--panel); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.14)' : 'background: transparent; color: var(--muted)')
      };
    });

    function pill(k) {
      return 'display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--' + k + '); background: var(--' + k + '-bg); border: 1px solid var(--' + k + '-bd)';
    }
    var LEVELS = ['Sin evidencia', 'Reproducido', 'Suficiente', 'Candidato', 'Validada'];
    function meter(level, k) {
      var segs = [];
      for (var i = 1; i <= 5; i++) {
        segs.push({ style: 'width: 22px; height: 6px; border-radius: 2px; background: ' + (i <= level ? 'var(--' + k + ')' : 'var(--empty)') });
      }
      return segs;
    }
    function dots(kind, n) {
      var out = [];
      for (var i = 0; i < 8; i++) {
        var s;
        if (i >= n) s = 'width: 8px; height: 8px; border-radius: 99px; background: var(--line-soft)';
        else if (kind === 'ok') s = 'width: 8px; height: 8px; border-radius: 99px; background: var(--ok)';
        else if (kind === 'q') s = 'width: 8px; height: 8px; border-radius: 99px; background: var(--q)';
        else s = 'width: 8px; height: 8px; border-radius: 99px; border: 1.5px solid var(--off-dot); box-sizing: border-box';
        out.push({ style: s });
      }
      return out;
    }
    function row(o) {
      return {
        id: o.id, title: o.title, note: o.note, verdict: o.verdict,
        pillStyle: pill(o.k),
        iOk: o.k === 'ok', iQ: o.k === 'q', iOff: o.k === 'off', iBad: o.k === 'bad',
        meter: meter(o.level, o.mk || 'ok'),
        meterLabel: o.meterLabel || LEVELS[o.level - 1] || 'Sin investigar',
        dots: dots(o.dotKind, o.runs),
        historyLabel: o.runs + ' ejecuciones',
        mock: o.origin === 'Replay', notMock: o.origin !== 'Replay', origin: o.origin,
        when: o.when
      };
    }
    var rows = [
      row({ id: 'BUG-001', title: 'El contador del carrito no baja al quitar el único producto', note: 'bug sembrado', verdict: 'Verificado', k: 'ok', level: 5, meterLabel: 'Validada · alternativas probadas', dotKind: 'ok', runs: 7, origin: 'Replay', when: '5 h' }),
      row({ id: 'BUG-002', title: 'El descuento del cupón ignora la cantidad', note: 'bug sembrado', verdict: 'Verificado', k: 'ok', level: 5, meterLabel: 'Validada · alternativas probadas', dotKind: 'ok', runs: 7, origin: 'Replay', when: '5 h' }),
      row({ id: 'BUG-003', title: 'Lo comprado reaparece en el carrito', note: 'bug sembrado', verdict: 'Verificado', k: 'ok', level: 3, mk: 'warn', meterLabel: 'Suficiente · 2 hipótesis lo quitan', dotKind: 'ok', runs: 7, origin: 'Replay', when: '5 h' }),
      row({ id: 'ADV-002', title: 'Compensador limitado a la ventana del fallo', note: 'caso trampa de causa raíz', verdict: 'Falsa validación', k: 'bad', level: 5, mk: 'bad', meterLabel: 'Validada por error', dotKind: 'ok', runs: 1, origin: 'Plan humano', when: '5 h' }),
      row({ id: 'WRONG-PREMISE-001', title: 'Quitar uno de dos productos actualiza el badge', note: 'esperado: premisa falsa', verdict: 'Inconcluso', k: 'q', level: 0, meterLabel: 'No aplica', dotKind: 'q', runs: 6, origin: 'Plan humano', when: '5 h' }),
      row({ id: 'HEALTHY-001', title: 'El contador sube al añadir un producto', note: 'esperado: app sana', verdict: 'No verificado', k: 'off', level: 0, meterLabel: 'No aplica', dotKind: 'off', runs: 8, origin: 'IA · claude-opus-5', when: '13 h' })
    ];
    var done = 'font-size: 12px; font-weight: 600; color: var(--ok)';
    var ni = 'font-size: 12px; font-weight: 500; color: var(--off); padding: 2px 8px; border-radius: 6px; border: 1.5px dashed var(--line-strong)';
    var wip = 'font-size: 12px; font-weight: 600; color: var(--fg)';
    var caps = [
      { n: '01', name: 'Síntoma', state: 'Listo', style: done },
      { n: '02', name: 'Plan con IA', state: 'Listo', style: done },
      { n: '03', name: 'Reproducción', state: 'Listo', style: done },
      { n: '04', name: 'Evidencia', state: 'Listo', style: done },
      { n: '05', name: 'Causa raíz', state: 'Candidato / validada', style: 'font-size: 12px; font-weight: 600; color: var(--warn)' },
      { n: '06', name: 'Inspección web', state: 'En construcción', style: wip },
      { n: '07', name: 'Arreglo', state: 'No implementado', style: ni },
      { n: '08', name: 'Verificar el arreglo', state: 'No implementado', style: ni }
    ];
    return { rootStyle: rootStyle, themeOptions: themeOptions, rows: rows, caps: caps };
  }
}
</script>
